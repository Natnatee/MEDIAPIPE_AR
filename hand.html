<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hand Tracking</title>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic@0.5.1635989137/holistic.js"></script>
    <!-- Add Hands (lighter) so HandTracker can use a hands-only mode for better performance -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.5.1635989137/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      .container {
        position: relative;
        width: 100vw;
        height: 100vh;
      }

      video {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scaleX(-1);
      }

      canvas {
        position: absolute;
        width: 100%;
        height: 100%;
        pointer-events: none;
        transform: scaleX(-1);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <video class="input_video" autoplay muted playsinline></video>
      <canvas class="guides"></canvas>
    </div>

    <script type="module">
      import { HandTracker } from "./src/utils/hand_2.js";

      const video = document.querySelector(".input_video");
      const canvas = document.querySelector(".guides");

      const tracker = new HandTracker(video, canvas, {
        cameraWidth: 1920,
        cameraHeight: 1080,
        leftHandColor: "yellow",
        leftHandPointColor: "red",
        rightHandColor: "lime",
        rightHandPointColor: "aqua",
        lineWidth: 4,
        pointSize: 5,
        // onResults: (results) => {
        //   console.log(results);
        // }
      });

      tracker.start();
    </script>
  </body>
</html>

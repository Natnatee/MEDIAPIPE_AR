<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Model Viewer</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }
      #canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <script src="https://unpkg.com/three@0.133.0/build/three.js"></script>
    <script src="https://unpkg.com/three@0.133.0/examples/js/loaders/GLTFLoader.js"></script>
    <script>
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x222222);

      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.set(0, 1, 3);

      const renderer = new THREE.WebGLRenderer({
        canvas: document.getElementById("canvas"),
        antialias: true,
      });
      renderer.setSize(window.innerWidth, window.innerHeight);

      const light = new THREE.DirectionalLight(0xffffff, 1);
      light.position.set(5, 5, 5);
      scene.add(light);
      scene.add(new THREE.AmbientLight(0xffffff, 0.5));

      const loader = new THREE.GLTFLoader();
      loader.load(
        "./glb/Santa_cameraman.glb",
        (gltf) => {
          scene.add(gltf.scene);

          // รวบรวมข้อมูล bones ทั้งหมด
          const bonesData = [];
          gltf.scene.traverse((object) => {
            if (object.isBone) {
              bonesData.push({
                name: object.name,
                parent: object.parent ? object.parent.name : "root"
              });

              const boneHelper = new THREE.AxesHelper(0.1);
              object.add(boneHelper);
            }
          });

          // แสดงข้อมูลในรูปแบบที่ก็อปได้ง่าย
          console.log("=== รายชื่อ Bones ทั้งหมด ===");
          console.log(`จำนวน: ${bonesData.length} bones`);
          console.log("\nรายชื่อ (ก็อปได้เลย):");
          console.log(JSON.stringify(bonesData, null, 2));
          
          // แสดงแบบ text ธรรมดา
          console.log("\n=== รายชื่อแบบ text ===");
          bonesData.forEach((bone, i) => {
            console.log(`${i + 1}. ${bone.name} (parent: ${bone.parent})`);
          });

          // แสดง skeleton helper
          const skeletonHelper = new THREE.SkeletonHelper(gltf.scene);
          skeletonHelper.visible = true;
          scene.add(skeletonHelper);
        },
        undefined,
        (error) => {
          console.error("Error loading model:", error);
        }
      );

      function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
